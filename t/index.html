<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>GeoGoose</title>
  <link rel="stylesheet" href="../leaflet/leaflet.css">
  <link rel="stylesheet" href="../style.css?v=20261021-map1">
</head>
<body>
  <header>
    <img class="brand-logo" src="../geogoose-logo.png" alt="" width="40" height="40">
    <strong>GeoGoose</strong>
    <span class="tagline" id="tagline"></span>
    <span id="info"></span>
    <a id="google" target="_blank" rel="noopener" hidden></a>
  </header>
  <details id="google-options" hidden>
    <summary id="google-summary"></summary>
    <div class="google-content">
      <section id="route-options" hidden>
        <p id="route-note"></p>
        <label class="map-setting">
          <span id="travel-label"></span>
          <select id="travel-mode" aria-describedby="route-note">
            <option value="driving" id="travel-driving"></option>
            <option value="walking" id="travel-walking"></option>
          </select>
        </label>
        <nav id="google-routes" aria-describedby="route-note"></nav>
      </section>
    </div>
  </details>
  <p id="map-status" role="status" hidden></p>
  <div id="map-view">
    <div class="map-toolbar">
      <button id="expand-map" type="button" aria-controls="map-view" aria-expanded="false" hidden></button>
    </div>
    <div id="map"></div>
  </div>
  <script src="../leaflet/leaflet.js"></script>
  <script src="../app.js?v=20261021-map1"></script>
</body>
</html>
